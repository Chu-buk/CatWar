    <style>
        /* === Базовые стили === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe Script', cursive, sans-serif;
        }

        .container {
            position: relative;
            width: 1000px;
            height: 813px;
            background: #2a241e;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }

        /* === Все слои === */
        .layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .layer img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .layer a,
        .layer .clickable {
            pointer-events: auto;
            cursor: pointer;
        }

        /* === Стили для страниц (переключаемые блоки) === */
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            pointer-events: none;
        }

        .page.active {
            display: block;
            pointer-events: auto;
        }

        .page img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* === Закладки (табы) === */
        .tab {
            position: absolute;
            cursor: pointer;
            pointer-events: auto;
            transition: opacity 0.15s;
            z-index: 100;
        }

        .tab img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .tab:hover {
            opacity: 0.85;
        }

        /* === Кликабельные области (невидимые ссылки) === */
        .click-area {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            background: transparent;
            border: none;
            z-index: 150;
        }

        /* === Аудиоплеер === */
        #audioPlayer {
            position: absolute;
            z-index: 160;
            pointer-events: auto;
            display: none;
        }

        #audioPlayer.active {
            display: block;
        }

        #audioPlayer button {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
        }

        #audioPlayer button img {
            display: block;
            width: 100%;
            height: auto;
        }

        .audiobar {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            z-index: 161;
            display: none;
        }

        .audiobar.active {
            display: block;
        }

        .audiobar input[type="range"] {
            width: 100%;
            height: 4px;
            -webkit-appearance: none;
            background: #e7d6b8;
            border-radius: 2px;
            outline: none;
            padding: 0;
            margin: 0;
        }

        .audiobar input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #311b11;
            cursor: pointer;
        }

        .audiobar input[type="range"]::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #311b11;
            border: none;
            cursor: pointer;
        }

        .audiobar input[type="range"]::-webkit-slider-runnable-track {
            height: 4px;
            background: #e7d6b8;
            border-radius: 2px;
        }

        .audiobar input[type="range"]::-moz-range-track {
            height: 4px;
            background: #e7d6b8;
            border-radius: 2px;
            border: none;
        }

        /* === Ссылки на соцсети === */
        .social-link {
            position: absolute;
            pointer-events: auto;
            z-index: 200;
            display: block;
            text-decoration: none;
            color: #120b79;
            font-size: 7px;
            letter-spacing: 2px;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .social-link:hover {
            opacity: 1;
            text-decoration: underline;
        }

        .social-link-dark {
            color: #1a1818;
        }

        /* === Стрелки навигации === */
        .nav-arrow {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            z-index: 180;
            display: none;
        }

        .nav-arrow.active {
            display: block;
        }

        .nav-arrow img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* === Кнопки-заглушки для невидимых областей === */
        .invisible-btn {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            background: transparent;
            border: none;
            z-index: 120;
        }
    </style>

    <!-- ========== СТРЕЛКИ НАВИГАЦИИ (для историй) ========== -->
    <div class="nav-arrow" id="btnNext" style="top:79.6%; left:70%; width:10.9%; height:2.1%;" onclick="nextStory()">
        <span style="display:block; width:100%; height:100%; background:rgba(255,255,255,0.01); cursor:pointer;">➡️</span>
    </div>

    <div class="nav-arrow" id="btnPrev" style="top:79.6%; left:14.3%; width:10.9%; height:2.1%;" onclick="prevStory()">
        <span style="display:block; width:100%; height:100%; background:rgba(255,255,255,0.01); cursor:pointer;">⬅️</span>
    </div>

    <div class="nav-arrow" id="btnPrevS" style="top:18.6%; left:10.3%; width:10.9%; height:4.6%;" onclick="prevStory()">
        <img src="https://raw.githubusercontent.com/Chu-buk/CatWar/refs/heads/main/%D0%A1%D1%82%D1%80%D0%B5%D0%BB%D0%BA%D0%B0%20%D0%B2%D0%BB%D0%B5%D0%B2%D0%BE.png" alt="Назад">
    </div>

    <div class="nav-arrow" id="btnNextS" style="top:18.6%; left:37.3%; width:10.9%; height:4.6%;" onclick="nextStory()">
        <img src="https://raw.githubusercontent.com/Chu-buk/CatWar/refs/heads/main/%D1%81%D1%82%D1%80%D0%B5%D0%BB%D0%BA%D0%B0%20%D0%B2%D0%BF%D1%80%D0%B0%D0%B2%D0%BE.png" alt="Вперед">
    </div>

    <!-- ========== СКРИПТЫ ========== -->
    <script>
        // === Переменные состояния ===
        let a = 0; // текущая страница (0-4)
        let b = 0; // подстраница для историй (4,5,6)
        const audio = new Audio('https://www.dropbox.com/scl/fi/8290kk53qpkvhoti5k1zn/Madeaux-Say-It.mp3?rlkey=8tz1itxp0y06tty38ihkjrc54&e=1&st=0vjmk7ae&raw=1');
        let isPlaying = false;

        // === Функция переключения страниц ===
        function goToPage(page) {
            a = page;
            if (page < 4) b = 0;
            if (page === 4) b = 4;
            render();
        }

        function nextStory() {
            if (b < 6) {
                b++;
                a = 10; // любой >4, чтобы оставаться в режиме историй
                render();
            }
        }

        function prevStory() {
            if (b > 4) {
                b--;
                a = 10;
                render();
            } else if (b === 4) {
                // если на первой истории, переходим на главную
                goToPage(0);
            }
        }

        // === Рендеринг ===
        function render() {
            // Скрываем все страницы
            document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));

            // Показываем нужную
            if (a === 0) {
                document.getElementById('page-main').classList.add('active');
            } else if (a === 1) {
                document.getElementById('page-lore').classList.add('active');
            } else if (a === 2) {
                document.getElementById('page-personality').classList.add('active');
            } else if (a === 3) {
                document.getElementById('page-empty').classList.add('active');
            } else if (a >= 4) {
                if (b === 4) document.getElementById('page-story1').classList.add('active');
                else if (b === 5) document.getElementById('page-story2').classList.add('active');
                else if (b === 6) document.getElementById('page-story3').classList.add('active');
            }

            // === Управление видимостью табов ===

            // Главная актив
            document.getElementById('tab-main-active').style.display = (a === 0) ? 'block' : 'none';
            // Главная неактивна (показываем всегда, кроме когда активна)
            document.getElementById('tab-main').style.display = (a !== 0) ? 'block' : 'none';

            // Лор актив
            document.getElementById('tab-lore-active').style.display = (a === 1) ? 'block' : 'none';
            // Лор неактивна
            document.getElementById('tab-lore').style.display = (a !== 1) ? 'block' : 'none';

            // Характер актив
            document.getElementById('tab-personality-active').style.display = (a === 2) ? 'block' : 'none';
            // Характер неактивна
            document.getElementById('tab-personality').style.display = (a !== 2) ? 'block' : 'none';

            // Внешность актив
            document.getElementById('tab-appearance-active').style.display = (a === 3) ? 'block' : 'none';
            // Внешность неактивна
            document.getElementById('tab-appearance').style.display = (a !== 3) ? 'block' : 'none';

            // Истории актив
            document.getElementById('tab-stories-active').style.display = (a >= 4) ? 'block' : 'none';
            // Истории неактивна
            document.getElementById('tab-stories').style.display = (a < 4) ? 'block' : 'none';

            // Левые закладки (показываются, если a>=4 или a===2 или a===3)
            const showLeftTabs = (a >= 4);
            document.getElementById('tab-lore-left').style.display = (a >= 4 || a === 3 || a === 2) ? 'block' : 'none';
            document.getElementById('tab-personality-left').style.display = (a >= 4 || a === 3) ? 'block' : 'none';
            document.getElementById('tab-appearance-left').style.display = (a >= 4) ? 'block' : 'none';
            document.getElementById('tab-main-left').style.display = (a >= 4 || a === 3 || a === 2) ? 'block' : 'none';

            // Аудиоплеер (только на странице Характер, a=2)
            document.getElementById('audioPlayer').classList.toggle('active', a === 2);
            document.getElementById('audioBar').classList.toggle('active', a === 2);

            // Стрелки навигации
            document.getElementById('btnNext').style.display = (a >= 4 && b !== 6) ? 'block' : 'none';
            document.getElementById('btnNextS').style.display = (a >= 4 && b !== 6) ? 'block' : 'none';
            document.getElementById('btnPrev').style.display = (a >= 4) ? 'block' : 'none';
            document.getElementById('btnPrevS').style.display = (a === 6) ? 'block' : 'none';

            // lay3 только на главной
            document.getElementById('lay3').style.display = (a === 0) ? 'block' : 'none';
        }

        // === Аудиоплеер ===
        function toggleAudio() {
            if (isPlaying) {
                audio.pause();
                document.getElementById('playBtnImg').src = 'https://raw.githubusercontent.com/Chu-buk/CatWar/refs/heads/main/Play.png';
                isPlaying = false;
            } else {
                audio.play();
                document.getElementById('playBtnImg').src = 'https://raw.githubusercontent.com/Chu-buk/CatWar/refs/heads/main/Pause.png';
                isPlaying = true;
            }
        }

        // Прогресс-бар
        audio.addEventListener('timeupdate', function() {
            const progress = (audio.currentTime / audio.duration) * 100;
            document.getElementById('audioProgress').value = progress;
        });

        document.getElementById('audioProgress').addEventListener('input', function() {
            const seekTime = (this.value / 100) * audio.duration;
            audio.currentTime = seekTime;
        });

        // === Инициализация ===
        render();

        console.log('✅ Сайт CatWar успешно загружен!');
        console.log('📄 Текущая страница: a=' + a + ', b=' + b);
    </script>

</div>
</body>
</html>
